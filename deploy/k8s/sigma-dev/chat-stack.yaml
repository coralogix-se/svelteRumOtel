apiVersion: v1
kind: Service
metadata:
  name: chat-backend
  labels:
    app: chat-backend
spec:
  selector:
    app: chat-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend
  labels:
    app: chat-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-backend
  template:
    metadata:
      labels:
        app: chat-backend
        app.kubernetes.io/name: svelte-chatbot
        app.kubernetes.io/component: chat-api
      annotations:
        resource.opentelemetry.io/service.name: svelte-chatbot
    spec:
      containers:
        - name: api
          image: 827602716714.dkr.ecr.us-west-2.amazonaws.com/svelte-chatbot-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=svelte-rum-sigma,k8s.node.name=$(K8S_NODE_NAME),k8s.deployment.name=chat-backend,k8s.container.name=api,deployment.environment.name=svelte-rum-sigma,k8s.cluster.name=SigmaDev"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: svelte-chatbot-app
                  key: gemini-api-key
            - name: CORALOGIX_GUARDRAILS_KEY
              valueFrom:
                secretKeyRef:
                  name: svelte-chatbot-app
                  key: coralogix-guardrails-key
            - name: GUARDRAILS_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-frontend
  labels:
    app: chat-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: chat-frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-frontend
  labels:
    app: chat-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-frontend
  template:
    metadata:
      labels:
        app: chat-frontend
        app.kubernetes.io/name: svelte-chatbot
        app.kubernetes.io/component: chat-web
      annotations:
        resource.opentelemetry.io/service.name: svelte-chatbot
    spec:
      containers:
        - name: web
          image: 827602716714.dkr.ecr.us-west-2.amazonaws.com/svelte-chatbot-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: PUBLIC_CORALOGIX_RUM_KEY
              valueFrom:
                secretKeyRef:
                  name: svelte-chatbot-app
                  key: rum-public-key
            - name: PUBLIC_CORALOGIX_DOMAIN
              value: US2
            - name: PUBLIC_RUM_PERSONA
              value: sigma
            - name: PUBLIC_RUM_USER_ID
              value: sigma-dev-01
            - name: PUBLIC_RUM_USER_NAME
              value: Sigma Dev
            - name: PUBLIC_CHAT_PAGE_TITLE
              value: "Chat Bot SigmaDev US2"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: CHAT_API_ORIGIN
              value: http://chat-backend:8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /livez
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
