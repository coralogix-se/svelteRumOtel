# In-namespace OTEL Collector — single US2 pipeline for SigmaDev.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 20
          http:
            endpoint: 0.0.0.0:4318

    connectors:
      forward/sm: {}
      spanmetrics:
        add_resource_attributes: true
        aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
        aggregation_cardinality_limit: 100000
        dimensions:
          - name: http.method
          - name: cgx.transaction
          - name: cgx.transaction.root
          - name: status_code
          - name: http.response.status_code
          - name: service.version
        histogram:
          unit: ms
          explicit:
            buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
        metrics_expiration: 5m
        metrics_flush_interval: 30s
        namespace: ""

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
        pod_association:
          - sources:
              - from: connection
      resource/deployment_meta:
        attributes:
          - key: deployment.environment.name
            action: upsert
            value: svelte-rum-sigma
          - key: k8s.cluster.name
            action: upsert
            value: SigmaDev
      groupbytrace:
        wait_duration: 5s
        num_traces: 1000
      coralogix:
        transactions:
          enabled: true
      batch:
        timeout: 2s
        send_batch_size: 1024

    exporters:
      otlp/cx:
        endpoint: ${env:CORALOGIX_INGRESS_ENDPOINT}
        tls:
          insecure: false
          server_name_override: ${env:CORALOGIX_INGRESS_TLS_SERVER_NAME}
        compression: gzip
        headers:
          Authorization: Bearer ${env:CORALOGIX_OTEL_KEY}

    extensions:
      health_check:
        endpoint: 0.0.0.0:13134

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource/deployment_meta, groupbytrace, coralogix, batch]
          exporters: [otlp/cx, forward/sm]
        traces/sm:
          receivers: [forward/sm]
          processors: [batch]
          exporters: [spanmetrics]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource/deployment_meta, batch]
          exporters: [otlp/cx]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [resource/deployment_meta, batch]
          exporters: [otlp/cx]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  labels:
    app: otel-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-svelte-rum-sigma-k8smeta
  labels:
    app: otel-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-svelte-rum-sigma-k8smeta
  labels:
    app: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-svelte-rum-sigma-k8smeta
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: svelte-rum-sigma
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: health
      port: 13134
      targetPort: 13134
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.158.0
          args:
            - --config=/etc/otelcol/config.yaml
            - --feature-gates=+connector.spanmetrics.legacyMetricNames
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 13134
              name: health
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          env:
            - name: CORALOGIX_OTEL_KEY
              valueFrom:
                secretKeyRef:
                  name: svelte-chatbot-app
                  key: coralogix-otel-key
            - name: CORALOGIX_INGRESS_ENDPOINT
              value: "18.98.18.193:443"
            - name: CORALOGIX_INGRESS_TLS_SERVER_NAME
              value: ingress.us2.coralogix.com
          readinessProbe:
            httpGet:
              path: /
              port: 13134
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13134
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
